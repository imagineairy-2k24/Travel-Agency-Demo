<!DOCTYPE html>
<html lang="en">
  <head>
    <script>
      /* Site base for GitHub Pages project path /Travel-Agency-Demo/ (no-op at domain root) */
      (function () {
        var base = "/";
        var repo = "Travel-Agency-Demo";
        var path = location.pathname || "/";
        if (path === "/" + repo || path.indexOf("/" + repo + "/") === 0) {
          base = "/" + repo + "/";
        } else if (/\.github\.io$/i.test(location.hostname)) {
          var seg = path.split("/").filter(Boolean)[0];
          if (seg) base = "/" + seg + "/";
        }
        document.write('<base href="' + base + '">');
      })();
    </script>
